<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23a78bfa%27/%3E%3C/svg%3E">
  <title>Odd One Out</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="hud">
      <div class="stat">
        <span class="label">Score</span>
        <span id="score">0</span>
      </div>
      <div class="stat lives-stat">
        <span class="label">Lives</span>
        <span class="lives" id="lives">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </div>
      <div class="stat">
        <span class="label">Best</span>
        <span id="best">0</span>
      </div>
    </header>

    <div class="stage">
      <div class="board" id="board"></div>
      <div class="feedback" id="feedback"></div>
      <div class="overlay" id="overlay">
        <h1 id="title">Odd One Out</h1>
        <p id="message">One tile has a slightly different shade. Find it before the grid grows.</p>
        <button id="action" type="button">Play</button>
      </div>
    </div>

    <footer class="hint">Three misses and the run is over.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
